<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="teaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="40%" stop-color="#047857" />
      <stop offset="80%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <radialGradient id="teaMist" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background: Lush Tea Plantation Rolling Hills -->
  <rect width="800" height="600" fill="url(#teaBg)" />

  <!-- Rolling Mountain Slopes -->
  <path d="M 0 350 Q 200 240 450 320 T 800 260 L 800 600 L 0 600 Z" fill="#065f46" opacity="0.6" />
  <path d="M 0 420 Q 300 320 550 410 T 800 340 L 800 600 L 0 600 Z" fill="#047857" opacity="0.8" />
  <path d="M 0 490 Q 250 410 500 480 T 800 430 L 800 600 L 0 600 Z" fill="#064e3b" />

  <!-- Tea Leaves Pattern on Hills -->
  <g fill="#34d399" opacity="0.25">
    <ellipse cx="120" cy="460" rx="14" ry="7" transform="rotate(-30 120 460)" />
    <ellipse cx="250" cy="500" rx="16" ry="8" transform="rotate(25 250 500)" />
    <ellipse cx="620" cy="480" rx="15" ry="7" transform="rotate(-15 620 480)" />
    <ellipse cx="710" cy="450" rx="13" ry="6" transform="rotate(35 710 450)" />
  </g>

  <!-- Rising Steam Trails -->
  <g fill="none" stroke="#f1f5f9" stroke-width="5" stroke-linecap="round" opacity="0.65">
    <path d="M 370 240 Q 350 200 375 160 T 360 100" />
    <path d="M 400 230 Q 425 180 395 140 T 410 80" />
    <path d="M 430 240 Q 450 200 425 160 T 440 100" />
  </g>

  <!-- Traditional Chai Glass / Kulhad Centerpiece -->
  <g transform="translate(400, 360)">
    <!-- Saucer / Base -->
    <ellipse cx="0" cy="70" rx="120" ry="24" fill="#451a03" />
    <ellipse cx="0" cy="65" rx="110" ry="20" fill="#78350f" />

    <!-- Terracotta Cup Body -->
    <path d="M -60 -90 L 60 -90 L 45 60 L -45 60 Z" fill="url(#cupGrad)" stroke="#451a03" stroke-width="4" />
    <ellipse cx="0" cy="-90" rx="60" ry="16" fill="#ca8a04" stroke="#451a03" stroke-width="3" />
    <!-- Tea Surface with Cardamom pods -->
    <ellipse cx="0" cy="-90" rx="54" ry="13" fill="#92400e" />
    <ellipse cx="-15" cy="-90" rx="6" ry="3" fill="#15803d" />
    <ellipse cx="15" cy="-92" rx="5" ry="2.5" fill="#fef08a" />

    <!-- Fresh Tea Leaf Accent -->
    <path d="M 45 30 Q 80 15 100 45 Q 75 60 45 30 Z" fill="#22c55e" stroke="#15803d" stroke-width="2" />
    <line x1="45" y1="30" x2="95" y2="43" stroke="#166534" stroke-width="1.5" />
  </g>

  <!-- Banner Card Label -->
  <rect x="250" y="510" width="300" height="52" rx="26" fill="#022c22" opacity="0.85" stroke="#34d399" stroke-width="1.5" />
  <text x="400" y="542" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="20" font-weight="800" fill="#a7f3d0" text-anchor="middle" letter-spacing="2">
    TEA &amp; REFRESHMENT BREAK
  </text>
</svg>
